<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dars jadvali</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1620;--sf:#16212d;--ln:#243445;--tx:#e8edf2;--mu:#8b9aab;--ac:#5fb3a5;--am:#d4a24c;--vi:#8fa6d9;--sk:#6aa7c7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.45 Onest,system-ui,sans-serif;background:var(--bg)}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 56px}.hide{display:none!important}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus{outline:2px solid var(--ac);outline-offset:2px}
/* wizard */
#bar{display:flex;gap:6px;margin-bottom:34px}#bar i{flex:1;height:5px;border-radius:9px;background:var(--ln)}#bar i.on{background:var(--ac)}
.bk{background:none;border:0;color:var(--mu);font-size:15px;padding:0;margin-bottom:16px}
#q{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.4px;margin:0 0 24px}
.big{width:100%;padding:18px 4px;border:0;border-bottom:2px solid var(--ln);background:transparent;color:var(--tx);font:600 24px Onest,sans-serif;border-radius:0}
.big:focus{outline:0;border-color:var(--ac)}.big::placeholder{color:#3f7468}
.hint{color:var(--mu);margin:12px 0 0;min-height:24px}.hint.er{color:#ff9aa9}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc{text-align:left;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:12px;padding:14px;min-height:90px;display:flex;flex-direction:column;justify-content:space-between;font-weight:700}
.fc b{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:#0b1a1f;background:var(--h);font-size:17px}
.crs{display:flex;gap:10px;flex-wrap:wrap}.crs button{width:84px;height:84px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:600 30px Onest,sans-serif}
.crs small{display:block;font:500 12px Onest,sans-serif;color:var(--mu)}
.go{width:100%;margin-top:28px;padding:16px;border:0;border-radius:12px;background:var(--ac);color:#06181a;font:700 16px Onest,sans-serif}
/* home */
.top{display:flex;align-items:center;gap:12px}.ava{width:48px;height:48px;border-radius:50%;background:var(--ac);color:#06181a;font:700 20px Onest;display:grid;place-items:center}
.who{flex:1;min-width:0}.who b{display:block;font-size:18px}.who span{color:var(--mu);font-size:14px}
.ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:transparent;color:var(--tx);font-size:18px}
.edt{margin-top:14px;padding:9px 14px;border:1px solid var(--ln);background:transparent;color:var(--mu);border-radius:10px;font:500 14px Onest,sans-serif}
.tiles{display:grid;gap:14px;margin-top:30px}
.tile{display:block;width:100%;text-align:left;border:1px solid var(--ln);border-left:4px solid var(--c);border-radius:14px;padding:24px 20px;color:var(--tx);background:var(--sf);min-height:130px;position:relative;overflow:hidden}.tile h2{margin:0;font-size:24px;letter-spacing:-.3px}.tile p{margin:6px 0 0;font-size:15px;color:var(--mu)}.tile em{position:absolute;right:16px;bottom:6px;font:700 64px Onest;font-style:normal;color:var(--c);opacity:.14}
.t1{--c:var(--ac)}.t2{--c:var(--am)}
/* schedule */
.hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}.hd h1{flex:1;margin:0;font-size:24px}
.date{display:flex;align-items:center;justify-content:space-between;margin:14px 0}.date .m{text-align:center}.date strong{font-size:22px;display:block}.date small{color:var(--mu)}
.arr{width:44px;height:44px;border-radius:50%;border:0;background:var(--sf);color:var(--tx);font-size:22px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:18px}
.d{border:0;background:transparent;color:var(--mu);padding:10px 0;border-radius:14px;font:500 13px Onest,sans-serif;position:relative}
.d b{display:block;color:var(--tx);font-size:19px;margin-top:2px}.d.sel{background:var(--sf);box-shadow:inset 0 -3px 0 var(--ac)}.d.now:after{content:"";position:absolute;top:6px;right:10px;width:6px;height:6px;border-radius:50%;background:var(--am)}
.cap{color:var(--mu);margin:0 0 12px}.cap b{color:var(--tx)}
.card{display:grid;grid-template-columns:62px 1fr;gap:14px;padding:16px 14px;margin-bottom:12px;border-radius:12px;background:var(--sf);border-left:4px solid var(--c)}
.tm b{display:block;font-size:19px}.tm span{display:block;color:var(--mu);font-size:14px;min-height:20px}.tm i{display:block;font-style:normal;color:var(--mu);font-size:12px;margin-top:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.card h3{margin:8px 0 6px;font-size:20px}.meta{color:var(--mu);font-size:14px}.note{color:#4f9d8c;font-size:13px;margin-top:4px}
.foot{display:flex;justify-content:flex-end;margin-top:10px}
.bkb{display:inline-block;text-decoration:none;border:1px solid var(--c);background:transparent;color:var(--c);border-radius:10px;padding:6px 14px;font:700 13px Onest,sans-serif}
.sun{text-align:center;padding:30px 10px}.stk{display:inline-grid;place-items:center;width:150px;height:150px;border-radius:32px;font-size:80px;background:#dfe7ee;border:6px solid #f2f5f8;box-shadow:0 8px 22px #0006;transform:rotate(-6deg)}.sun p{font:600 22px/1.3 Onest,sans-serif;margin:24px 0 0}
.bk2{display:flex;justify-content:space-between;align-items:center;padding:16px;margin-bottom:8px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;color:var(--tx);text-decoration:none;font-weight:500}.bk2 i{color:var(--am);font-style:normal;font-size:22px}#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sf);border:1px solid var(--ac);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;z-index:9}#toast.on{opacity:1}
.cmd{margin-top:18px;padding:18px 16px;border-radius:12px;background:#241a1f;border:1px solid #9c4a55;border-left:4px solid #c25b69}.cm{font:700 20px/1.25 Onest,sans-serif;color:#f2d4d8}.cmd p{margin:10px 0 0;color:#c98f98;font-size:15px}
.ft{margin-top:40px;padding-top:6px;border-top:1px solid var(--ln)}.ft h3{margin:18px 0 8px;font-size:20px}.ft p{color:var(--mu);margin:0 0 16px}.ft small{display:block;color:#5d6f80;font-size:13px}
.topic{white-space:pre-line;margin-top:8px;font-size:14px;color:var(--tx)}.topic.e{color:#5d7183}
.none{padding:28px 16px;text-align:center;color:var(--mu);border:1px dashed var(--ln);border-radius:16px}
/* books */
.sub{background:var(--sf);border-radius:16px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--ln)}.sub.hl{border-color:var(--am)}
.sub h3{margin:0 0 6px;font-size:18px}.sub a{display:block;color:var(--am);padding:5px 0;text-decoration:none}.sub p{margin:0;color:var(--mu);font-size:14px}
</style>
</head>

<div class="wrap">

</section>

  <div class="strip" id="strip"></div>
  <p class="cap" id="cap"></p>

</section>

<section id="bks" class="hide">

  <div id="bl"></div>
</section>
</div>

const F2=["Davolash"],F3=["Davolash"];
const WT=[

 1:"Mavzu: Teri va uning hosilalari",2:"Mavzu: Nafas olish tizimi",3:"Mavzu: Ovqat hazm qilish sistemasi",4:"Mavzu: Ovqat hazm qilish sistemasi",
 5:"Mavzu: Siydik ajratuvchi tizimi",6:"Mavzu: Erkaklar jinsiy tizimi",7:"Mavzu: Ayollar jinsiy tizimi",8:"Mavzu: Ayollar jinsiy tizimi",

 13:"Mavzu: Sezgi aʼzolari",14:"Mavzu: Sezgi aʼzolari"}},
{f:["Davolash"],c:"2",k:["gigiyena","gigiena"],ty:"amaliyot",w:{1:"Mavzu: Kasalxona xonalari mikroiqlimining gigienik ahamiyati (harorat, namlik, havo harakat tezligi, bosim)",2:"Mavzu: Kasalxona xonalari havosining antropogen ifloslanishi haqida tushuncha",3:"Mavzu: Kasalxona xonalari yoritilganligining ahamiyati",4:"Mavzu: DPMlarda INMlardan foydalanilganda dozimetrik va radiometrik nazorat oʻtkazishning asoslari",5:"Mavzu: OʻzR aholisining eng muhim yuqumli boʻlmagan kasalliklari profilaktikasining gigienik jihatlari. Kasalxona ichi infeksiyasi va uni oldini olish (SanQVM 0342-17)",6:"Mavzu: Loyiha materiallari davolash-profilaktika muassasalarini gigienik baholash (Palata seksiya boʻyicha dalolatnoma tuzish)",7:"Mavzu: DPMda ratsional suv taʼminotining ahamiyati. Ichimlik suvining sifatini yaxshilashning zamonaviy usullari haqida tushuncha",8:"Mavzu: Ratsional ovqatlanish. Oziq-ovqatning ozuqaviy yukining inson salomatligidagi roli",9:"Mavzu: Bemorlarning ovqatlanishini tashkil qilish va uning gigienik nazorati",10:"Mavzu: Organizmning vitaminlar bilan taʼminlanganligini oʻrganish va baholash",11:"Mavzu: Ovqat mahsulotlarining sifatini gigienik baholash",12:"Mavzu: Ovqatdan zaharlanishlar va ularni oldini olish choralari"}},
{f:F3,c:"2",k:["odamanatomiyasi"],ty:"amaliyot",w:{1:"Mavzu: Markaziy nerv tizimining funksional anatomiyasi. Orqa miya va orqamiya pardalari, uning yoshga doir xususiyatlari. Boʻyin va bel-dumgʻaza kengaymasi, miya konusi, terminal ip. Orqa miyaning kulrang va oq moddalarining tuzilishi. Orqa miya segmentlari. Segmentlarning skeletotopiyasi.",2:"Mavzu: Bosh miyaning umumiy koʻrinishi. Bosh miyaning asosi. 12 juft bosh miya nervlarining chiqish joylari.",3:"Mavzu: Uzunchoq miya va koʻprik. Ularning tuzilishi va yoshga qarab oʻzgarishi. Miyachaning tuzilishi va yoshga qarab oʻzgarishi. IV qorincha, rombsimon chuqurcha. Rombsimon chuqurchada bosh miya nervlari oʻzaklarining joylashishi. Retikulyar formatsiya tushunchasi. Nafas olish va qon tomir markazlarining lokalizatsiyasi. Miyacha chuvalchangi va yarim sharlarining boʻlaklari. Miyachaning miyaning qoʻshni qismlari bilan aloqasi. Miyachaning pastki, oʻrta va yuqori oyoqlarining joylashishi va oʻtkazuvchi yoʻllari. Toʻrtinchi qorinchaning tubi va tomi.",4:"Mavzu: Oʻrta miyaning tuzilishi va yoshga qarab oʻzgarishi. Oraliq miya (koʻruv boʻrtigʻi sohasi) tuzilishi va yoshga qarab oʻzgarishi. Oraliq miya (gipotalamus), III-qorincha, yoshga qarab oʻzgarishi. Qizil yadro va qora moddaning lokalizatsiyasi va funksiyalari. Ekstrapiramidal tizim tushunchasi. Epitalamus. Talamus yadrolari komplekslari va poʻstloq osti sezgi markazi tushunchasi. Metatalamus. Gipofiz bezi.",5:"Mavzu: Oxirgi miya. Uning yoshga qarab oʻzgarishi. Yarim sharlarning oq moddasi. Bazal oʻzaklar. Yon qorinchalar. Bosh miya poʻstlogʻi. Poʻstloqda markazlarning joylashuvi. Bosh miya pardalari.",6:"Mavzu: Oddiy refleks yoyi. Sezuv oʻtkazuv yoʻllari. Harakat oʻtkazuv yoʻllari.",7:"Mavzu: Periferik nerv tizimi funksional anatomiyasi. Orqa miya nervlarini hosil boʻlishi. Orqa miya nervlarining orqa shoxlari. Koʻkrak nervlari. Boʻyin chigali.",8:"Mavzu: Yelka chigalining hosil boʻlishi va uning qisqa shoxlari. Yelka chigalining uzun shoxlari. Qoʻl terisining innervatsiyasi. Bel chigali. Dumgʻaza chigalining hosil boʻlishi va uning shoxlari. Oyoq terisining innervatsiyasi.",9:"Mavzu: Bosh miya nervlarining hosil boʻlishi. I, III, IV, VI, XI, XII juft bosh miya nervlari.",10:"Mavzu: Uch shoxlik nerv. Uch shoxlik nervlarining vegetativ tugunlari.",11:"Mavzu: VII–IX juft bosh miya nervlari.",12:"Mavzu: Adashgan nerv. Adashgan nervning oʻziga xos tuzilishi.",13:"Mavzu: Vegetativ nerv tizimining simpatik va parasimpatik qismi.",14:"Mavzu: Koʻrish aʼzosi. Koʻz olmasining tuzilishi va yoshga qarab oʻzgarishi. Koʻzning yordamchi apparati. Ularning yoshga qarab oʻzgarishi. Koʻruv oʻtkazuv yoʻli. II juft bosh miya nervi. Koʻzning ichki yadrosi.",15:"Mavzu: Eshitish aʼzosi. Tashqi va oʻrta quloqning funksional va yoshli anatomiyasi. Ichki quloq. Eshituv va muvozanat analizatorlarining oʻtkazuv yoʻli. VIII juft bosh miya nervi. Teri va uning hosilalari: sochlar, tirnoqlar, sut bezi. Taʼm bilish va hidlov analizatorlari. I juft bosh miya nervi."}},
{f:F3,c:"2",k:["psixologiya"],ty:"seminar",w:{1:"Mavzu: Psixologiya fanining predmeti, maqsad va vazifalari va tarixi. Psixologiya fanining obyekti va ilmiy tadqiqot metodlari. Psixologiya fanining boshqa fanlar bilan aloqadorligi va tarmoqlari.",2:"Mavzu: Psixologiya fanining tibbiyotda tutgan oʻrni va ahamiyati. Patopsixologiya. Psixopotologiya. Shifokor faoliyatida inklyuziv taʼlimning oʻrni.",3:"Mavzu: Shifokor kasbining shakllanish komponentlari. Shifokor shaxsiga taʼsir etuvchi ijtimoiy stereotiplar. Shifokor kompetensiyalari.",4:"Mavzu: Xulq-atvorning psixofiziologik asosi. Psixikaning nerv-fiziologik asoslari. Insonlar va hayvonlar psixikasining rivojlanishi.",5:"Mavzu: Ong va ong osti konsepsiyalari. Ongning xossalari, individual-psixologik xususiyatlari.",6:"Mavzu: Yosh davrlari psixologiyasi va ularning yoshga xos xususiyatlari.",7:"Mavzu: Bilish jarayonlari: Diqqat va uning xususiyatlari, turlari.",8:"Mavzu: Sezgi. Sezgilarning nerv-fiziologik asoslari. Sezgilar tasnifi va turlari. Idrok haqida tushuncha, idrokning asosiy xossalari va turlari.",9:"Mavzu: Xotira va hayolning nerv-fiziologik asoslari, turlari, jarayonlari.",10:"Mavzu: Tafakkur haqida tushuncha, operatsiyalari, turlari, jarayonlari.",11:"Mavzu: Faoliyat. Faoliyat strukturasi, turlari. Ehtiyoj va uning turlari. Motiv va motivatsiya tushunchalarining mazmuni.",12:"Mavzu: Shaxs haqida tushuncha. Shaxsning rivojlanish mexanizmlari va uning shakllanishiga taʼsir etuvchi omillar.",13:"Mavzu: Muloqot va nutq haqida tushuncha. Guruh va jamoa.",14:"Mavzu: Shaxsiy salomatlik psixologiyasi. Shaxsning emotsional-irodaviy xususiyatlari.",15:"Mavzu: Individual psixologik xususiyatlar. Temperament. Xarakter va qobiliyat."}},
{f:["Davolash"],c:"2",k:["mikrobiologiya"],ty:"amaliyot",w:{1:"Mavzu: Mikroorganizmlarning morfologiyasi, boʻyash usullari.",2:"Mavzu: Mikroorganizmlarning strukturasi, murakkab boʻyash usullari.",3:"Mavzu: Mikroorganizmlarning fiziologiyasi.",4:"Mavzu: Oziqli muhitlar, tasnifi, qoʻyilgan talablar.",5:"Mavzu: Aerob va anaerob bakteriyalarning sof kulturasini ajratish bosqichlari.",6:"Mavzu: Tashqi muhit omillarini mikroorganizmlarga taʼsiri.",7:"Mavzu: Mikroorganizmlarning ekologiyasi, suv, havo, tuproq mikroflorasi.",8:"Mavzu: Odam normal mikroflorasi, tekshirish usullari.",9:"Mavzu: Kimyoterapiya va antibiotiklar, tasnifi, talablari, asoratlari, bakteriyalarning antibiotiklarga sezgirligini aniqlash usullari.",10:"Mavzu: Umumiy virusologiya va bakteriofaglar.",11:"Mavzu: Infeksiya va infeksion jarayon.",12:"Mavzu: Immunitet va immun sistema. B-hujayralarning yetilishi. Tugʻma immunitet hujayralari. T-hujayralar. Hujayra vositachiligidagi immunitet. Hujayra vositachiligidagi sitotoksik javob. Sitokinlar.",13:"Mavzu: Antigen va antitelo.",14:"Mavzu: Serologik reaksiyalar: agglyutinatsiya reaksiyasi, KBR, gemagglyutinatsiya reaksiyasi, presipitatsiya reaksiyasi, immunoflyuoristensiya reaksiyasi, bakterioliz reaksiyasi.",15:"Mavzu: Immunodefitsitlar, tasnifi. Vaksina va immunologik zardoblar. Klassifikatsiyasi, ishlatilishi, asoratlar."}},
{f:["Davolash"],c:"2",k:["mikrobiologiya"],ty:"maruza",l:["Modulga kirish. Tibbiyot mikrobiologiyasi. Mikrobiologiya, virusologiya, immunologiya fanlarining maqsadi, vazifalari va rivojlanish tarixi. Mikroorganizmlar sistematikasi, klassifikatsiyasi. Bakteriyalar morfologiyasi. Bakteriya hujayrasining tuzilishi va kimyoviy tarkibi, oʻlchamlari va mikrobiologik amaliyotdagi ahamiyati.","Mikroorganizmlar fiziologiyasi.","Umumiy virusologiya. Bakteriofaglar.","Tashqi muhit omillarini mikroorganizmlarga taʼsiri. Kimyoterapevtik preparatlar va antibiotiklar.","Mikroorganizmlar ekologiyasi. Suv, tuproq, havo mikroflorasi. Odam organizmi mikroflorasi, ularni oʻrganish usullari va tibbiyot amaliyotida ahamiyati.","Infeksiya haqida taʼlimot. Immunitet haqida tushuncha. Immunitet turlari. Immunitet aʼzolari. Asosiy histomoslik kompleksi. Immunitetdagi gumoral omillar. B-hujayralarning yetilishi. Tugʻma immunitet hujayralari. T-hujayralar. Hujayra vositachiligidagi immunitet. Hujayra vositachiligidagi sitotoksik javob. Sitokinlar. Virusga qarshi va antibakterial immunitet reaksiyasi."]},
{f:F2,c:"2",k:["biologikkimyo","biokimyo"],ty:"amaliyot",w:{1:"Mavzu: Metabolizmga kirish. Oziqlanish biokimyosi. Metabolizm haqida tushuncha.",2:"Mavzu: Biomembranalar. Membrana retseptorlari. Hujayralarda signal oʻtkazish yoʻllari.",3:"Mavzu: Biologik oksidlanish. Katabolizmning umumiy yoʻllari.",4:"Mavzu: Uglevodlar almashinuvi va ularning vazifalari.",5:"Mavzu: Glyukoza katabolizmi va glyukoneogenez. Pentozafosfat yoʻlining ahamiyati.",6:"Mavzu: Fruktoza va galaktoza almashinuvi. Glyukoza gomeostazini boshqarish.",7:"Mavzu: Lipidlarning tuzilishi, funksiyasi va almashinuvi.",8:"Mavzu: Oraliq yogʻ almashinuvi.",9:"Mavzu: Murakkab lipidlar almashinuvi. Xolesterin metabolizmi. Yogʻ almashishining boshqarilishi.",10:"Mavzu: Oqsillarning hazm boʻlishi, aminokislotalarning soʻrilishi va toʻqimalarda tarqalishi.",11:"Mavzu: Aminokislotalar metabolizmining umumiy yoʻlari. Aminotransferazalar. Aminokislotalarning dekarboksillanishi.",12:"Mavzu: Azot almashinuvining yakuniy mahsulotlari. Siydik sintezi va chiqarilishining buzilishi.",13:"Mavzu: Ayrim aminokislotalar almashinuvi va irsiy kasalliklar.",14:"Mavzu: Nukleotidlar almashinuvi.",15:"Mavzu: Uglevodlar, yogʻlar va aminokislotalar almashinuvi oʻrtasidagi bogʻliqlik."}},
{f:F2,c:"2",k:["fiziologiya"],ty:"amaliyot",w:{1:"Mavzu: Fiziologiya moduli, rivojlanishi, tibbiyotdagi ahamiyati. Toʻqimalarning fiziologik xossalari. Qoʻzgʻaluvchanlik parametrlari. Taʼsirlash qonunlari.",2:"Mavzu: Qoʻzgʻaluvchan toʻqimalarda bioelektrik hodisalar. Oʻzgarmas tok taʼsir etish qonunlari.",3:"Mavzu: Asab tolalari va sinapslarining xossalarini oʻrganish. Tormozlanish.",4:"Mavzu: Skelet mushaklari: sarkomerning tuzilishi, sirgaluvchi filamentlar, nazariyasi, Ca ning roli, yakka va tetanik qisqarish turlari. Silliq mushaklarning fazali va tonik tolalari."}},
{f:F2,c:"2",k:["fiziologiya"],ty:"maruza",l:["Fiziologiyaga kirish. Qoʻzgʻaluvchan toʻqimalarda bioelektr hodisalar.","Skelet mushaklari: sarkomerning tuzilishi, sirgaluvchi filamentlar, nazariyasi, Ca ning roli, yakka va tetanik qisqarish turlari. Silliq mushaklarning fazali va tonik tolalari. Nerv tolalari va sinapslar fiziologiyasi.","Gomeostaz haqida tushuncha. Organizmning biologik suyuqliklari. Qonning fizikaviy-kimyoviy xossalari. Shaklli elementlar mansubligi. Qonning himoya xossalari. Gemostaz. Qon guruhlari.","Nafas tizimining funksional xususiyatlari. Gazlarni qon bilan tashilishi. Nafasning boshqarilishi. Ayiruv tizimining fiziologiyasi. Buyraklar funksiyalari."]},
{f:F2,c:"2",k:"gistologiya",ty:"maruza",l:["Teri va uning hosilalari. Nafas olish sistemasi","Ovqat hazm qilish tizimi","Siydik ayiruv sistemasi. Erkaklar jinsiy sistemasi","Ayollar jinsiy sistemasi. Odam embriologiyasi asoslari","Nerv tizimi","Sezgi aʼzolari"]}

const store={get(){try{return JSON.parse(localStorage.getItem("dj2"))}catch(e){return null}},set(v){try{localStorage.setItem("dj2",JSON.stringify(v))}catch(e){}}};
let S=store.get()||{},step=0,cur=new Date();cur.setHours(0,0,0,0);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const weekNo=d=>Math.round((addD(d,-dow(d))-new Date(START+"T00:00:00"))/864e5/7)+1;
function pick(l,d){const p=l[4].split(" / "),t=l[6]?l[6].split(" / "):[],w=weekNo(d),i=(((w-1)%p.length)+p.length)%p.length;return[p[i],t[i]||""]}
function topicFor(sub,ty,d){const x=TOPICS[iso(d)+"|"+sub];if(x)return"Mavzu: "+x;const w=weekNo(d),s=nz(sub);
  for(const r of WT)if(r.f.includes(S.fac)&&r.c===S.course&&[].concat(r.k).some(x=>s.includes(x))&&r.ty===ty){if(r.l){const m=r.l[Math.floor((w-1)/2)];if(m)return"Mavzu: "+m}else if(r.w[w])return r.w[w]}return""}
const dow=d=>(d.getDay()+6)%7,addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function view(v){const was=!$(v).classList.contains("hide");["wiz","home","sch","bks"].forEach(x=>$(x).classList.toggle("hide",x!==v));if(!was)window.scrollTo(0,0)}

/* ---- roʻyxatdan oʻtish ---- */
function wiz(){
  view("wiz");const b=$("body"),h=$("hint"),n=$("next");h.textContent="";h.className="hint";b.innerHTML="";
  $("bar").innerHTML=[0,1,2,3,4].map(i=>'<i class="'+(i<=step?"on":"")+'"></i>').join("");
  $("back").classList.toggle("hide",step===0);n.classList.toggle("hide",step>=1&&step<=3);n.textContent=step===4?"Jadvalni ochish":"Davom etish";
  if(step===0){$("q").textContent="Ismingiz nima?";b.innerHTML='<input class="big" id="f" autocomplete="name" placeholder="Ism va familiya">';$("f").value=S.name||""}
  if(step===1){$("q").textContent="Siz kimsiz?";const g=document.createElement("div");g.className="fgrid";
    [["m","👦","Oʻgʻil bola"],["f","👧","Qiz bola"]].forEach(([k,e,l])=>{const x=document.createElement("button");x.className="fc";x.style.minHeight="130px";x.innerHTML='<span style="font-size:44px"></span><span></span>';x.children[0].textContent=e;x.children[1].textContent=l;x.onclick=()=>{S.gender=k;step=2;wiz()};g.appendChild(x)});b.appendChild(g)}
  if(step===2){$("q").textContent="Qaysi fakultetda oʻqiysiz?";const g=document.createElement("div");g.className="fgrid";
    FACS.forEach((f,i)=>{const x=document.createElement("button");x.className="fc";x.style.setProperty("--h",HUE[i%HUE.length]);x.innerHTML="<b></b><span></span>";x.children[0].textContent=f[0];x.children[1].textContent=f;x.onclick=()=>{S.fac=f;step=3;wiz()};g.appendChild(x)});b.appendChild(g)}
  if(step===3){$("q").textContent="Nechanchi kursdasiz?";const g=document.createElement("div");g.className="crs";
    for(let c=1;c<=4;c++){const x=document.createElement("button");x.innerHTML=c+"<small>kurs</small>";x.onclick=()=>{S.course=String(c);step=4;wiz()};g.appendChild(x)}b.appendChild(g);h.textContent=S.fac}
  if(step===4){$("q").textContent="Guruh raqamingiz?";b.innerHTML='<input class="big" id="f" maxlength="10" placeholder="207">';$("f").value=S.group||"";
    h.textContent=S.fac+" · "+S.course+"-kurs"+(Object.keys(gsOf(S.fac,S.course)).length?"":" — bu kurs jadvali hali kiritilmagan, jadval qoʻshilgach chiqadi.")}
}
$("back").onclick=()=>{step--;wiz()};
$("next").onclick=()=>{
  const f=$("f"),h=$("hint");
  if(step===0){const v=f.value.trim();if(!v){h.textContent="Ismingizni yozing.";h.className="hint er";return}S.name=v;step=1;wiz();return}
  if(step===4){const v=norm(f.value),gs=gsOf(S.fac,S.course);
    if(!v){h.textContent="Guruh raqamini yozing.";h.className="hint er";return}
    if(Object.keys(gs).length&&!gs[v]){h.textContent="Bu kursda bunday guruh topilmadi. Raqamni tekshiring.";h.className="hint er";return}
    S.group=v;store.set(S);home()}
};
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!$("wiz").classList.contains("hide")&&(step===0||step===4))$("next").click()});

/* ---- bosh sahifa ---- */
function home(){view("home");$("ava").textContent=S.name[0].toUpperCase();$("nm").textContent=S.name;$("inf").textContent=S.fac+" · "+S.course+"-kurs · "+S.group+"-guruh"}
$("edit").onclick=()=>{step=0;wiz()};
document.querySelectorAll("[data-home]").forEach(b=>b.onclick=home);
$("toS").onclick=()=>{cur=new Date();cur.setHours(0,0,0,0);sched()};
$("toB").onclick=books;

/* ---- dars jadvali ---- */
const lessons=()=>(((D[S.fac]||{})[S.course]||{})[S.group]||[]);
const SH=40;
const mm=s=>{const p=s.split(":");return+p[0]*60+ +p[1]},hm=n=>String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
function isShort(l,d){const m=(l[7]||"").match(/^(\d+) haftadan (\d+) soatlikka/);return!!m&&+m[2]===3&&weekNo(d)>=+m[1]}
function time(l,d){const a=l[1],b=l[2];if(l[8])return[l[8],""];
  let r=a===b?(TL[a]||["",""]):(TP[a+"-"+b]||[(TL[a]||[""])[0],(TL[b]||["",""])[1]]);
  if(r[0]&&r[1]&&isShort(l,d))r=a<=1?[hm(mm(r[0])+SH),r[1]]:[r[0],hm(mm(r[1])-SH)];
  return r}
const cyc=()=>{const T=(C[S.fac]||{})[S.course];return T&&T.g[S.group]!==undefined?T:null};
function cycleFor(d,T){const x=iso(d);if(T.wd.indexOf(x)<0)return{off:1};for(const[a,b,n]of T.s[T.g[S.group]])if(x>=a&&x<=b){const ds=T.wd.filter(y=>y>=a&&y<=b);return{n,k:ds.indexOf(x)+1,t:ds.length,a,b}}return{none:1}}
const fd=s=>{const p=s.split("-");return+p[2]+" "+MO[+p[1]-1]};
function cycleDay(list,di,isT){const T=cyc(),c=cycleFor(cur,T),now=new Date();
  if(c.off||c.none){list.innerHTML='<div class="none">'+(c.off?"Bu kunda dars yoʻq (dam olish yoki bayram kuni)":"Bu kunda dars yoʻq")+'</div>';return}
  if(isT&&now.getHours()*60+now.getMinutes()>=mm(CYCLE_END)){$("cap").innerHTML="<b>Bugun</b> dars tugadi.";cmd(list,di);return}
  const d=document.createElement("div");d.className="card";d.style.setProperty("--c","var(--sk)");
  d.innerHTML='<div class="tm"><b></b><span></span><i></i></div><div><span class="tag">SIKL</span><h3></h3><div class="meta"></div><div class="foot"><button class="bkb">Kitobi</button></div></div>';
  d.querySelector(".tm b").textContent=c.k+"-kun";d.querySelector(".tm span").textContent="/ "+c.t+" kun";d.querySelector(".tm i").textContent="Sikl";
  d.querySelector("h3").textContent=c.n;d.querySelector(".meta").textContent=fd(c.a)+" – "+fd(c.b);
  const k=findBook(c.n),bb=d.querySelector(".bkb");
  if(k){const a=document.createElement("a");a.className="bkb";a.href=k.u;a.target="_blank";a.rel="noopener";a.textContent="Kitobi";bb.replaceWith(a)}else bb.onclick=()=>toast("Bu fan kitobi hali qoʻshilmagan");
  list.appendChild(d)}
function ended(l,now){const t=time(l,now);let m=t[1]&&t[1].match(/^(\d+):(\d+)/),e;
  if(m)e=+m[1]*60+ +m[2];else{const s=t[0]&&t[0].match(/^(\d+):(\d+)/);if(!s)return false;e=+s[1]*60+ +s[2]+90}
  return now.getHours()*60+now.getMinutes()>=e}
function nextInfo(di){if(cyc()){const c=cycleFor(addD(cur,di===5?2:1),cyc());return c.n?(di===5?"Dushanba darsi":"Ertangi dars")+": "+c.n:""}let n=(di+1)%7;if(n===6)n=0;const nl=lessons().filter(l=>l[0]===n+1).sort((a,b)=>a[1]-b[1]);if(!nl.length)return"";
  const nd=addD(cur,di===5?2:1),names=[...new Set(nl.map(l=>pick(l,nd)[0]))];return(n===(di+1)%7?"Ertangi darslar":DF[n][0].toUpperCase()+DF[n].slice(1)+" darslari")+": "+names.join(", ")}
function cmd(list,di){const d=document.createElement("div");d.className="cmd";d.innerHTML='<div class="cm"></div><p></p>';
  d.firstChild.textContent="📵 Endi telefon oʻynamasdan darsingni qil!";d.querySelector("p").textContent=nextInfo(di);list.appendChild(d)}
function sched(){
  view("sch");const today=new Date();today.setHours(0,0,0,0),di=dow(cur),mon=addD(cur,-di),sat=addD(mon,6),isT=cur.getTime()===today.getTime();
  $("hT").textContent=isT?"Bugun":DF[di][0].toUpperCase()+DF[di].slice(1);
  $("hS").textContent=cur.getDate()+" "+MO[cur.getMonth()]+" · "+mon.getDate()+"–"+sat.getDate()+" "+MO[sat.getMonth()]+(weekNo(cur)>=1?" · "+weekNo(cur)+"-hafta":"");
  const st=$("strip");st.innerHTML="";
  for(let i=0;i<7;i++){const d=addD(mon,i),b=document.createElement("button");b.className="d"+(d.getTime()===cur.getTime()?" sel":"")+(d.getTime()===today.getTime()?" now":"");b.innerHTML=DS[i]+"<b>"+d.getDate()+"</b>";b.onclick=()=>{cur=d;sched()};st.appendChild(b)}
  const list=$("list");list.innerHTML="";
  if(di===6){$("cap").textContent="";const boy=S.gender!=="f";list.innerHTML='<div class="sun"><div class="stk"></div><p></p></div>';list.querySelector(".stk").innerHTML=boy?'<span style="position:relative;display:inline-block;line-height:1">👨‍🌾<span style="position:absolute;right:-38px;bottom:-16px;transform:scale(.6);transform-origin:bottom right;display:block;line-height:0"><svg viewBox="0 0 100 100" width="104" height="104"><g transform="rotate(38 50 50)"><rect x="46" y="14" width="8" height="82" rx="4" fill="#b7793f"/><rect x="46" y="14" width="3" height="82" rx="1.5" fill="#d79a5c"/><path d="M24 10h52l-7 24H31z" fill="#aab6bd"/><path d="M24 10h52l-1.8 6H25.8z" fill="#dfe7eb"/><rect x="43" y="30" width="14" height="9" rx="2" fill="#7b8a92"/></g></svg></span></span>':'<span style="position:relative;display:inline-block;line-height:1">🛋️<small style="position:absolute;top:-16px;right:-20px;font-size:46px">😴</small></span>';list.querySelector("p").textContent=boy?"Uydagi ishlar sizni kutmoqda":"Bugun dam. Maroqli dam oling";return}
  $("cap").innerHTML="<b>"+(isT?"Bugun ":"")+DF[di]+"</b> kuni darslar:";
  if(cyc()){cycleDay(list,di,isT);return}
  const all=lessons().filter(l=>l[0]===di+1).sort((a,b)=>a[1]-b[1]);
  if(!all.length){list.innerHTML='<div class="none">'+(lessons().length?"Bu kunda dars yoʻq":"Bu kurs jadvali hali kiritilmagan")+'</div>';return}
  const ls=isT?all.filter(l=>!ended(l,new Date())):all;
  if(isT&&!ls.length)$("cap").innerHTML="<b>Bugun</b> darslar tugadi.";
  ls.forEach(l=>{const[,a,b,ty,sub0,room,tch0,note]=l,tt=time(l,cur),[tn,tc]=TY[ty],pk=pick(l,cur),sub=pk[0],tch=pk[1];
    const c=document.createElement("div");c.className="card";c.style.setProperty("--c",tc);
    c.innerHTML='<div class="tm"><b></b><span></span><i></i></div><div><span class="tag"></span><h3></h3><div class="meta"></div><div class="note"></div><div class="topic"></div><div class="foot"><button class="bkb">Kitobi</button></div></div>';
    const q=s=>c.querySelector(s);q(".tm b").textContent=tt[0];q(".tm span").textContent=tt[1];q(".tm i").textContent=(a===b?a:a+"-"+b)+"-para";
    q(".tag").textContent=tn;q("h3").textContent=sub;q(".meta").textContent=[room,tch].filter(Boolean).join(" · ");q(".note").textContent=note;const tp=topicFor(sub,ty,cur),tq=q(".topic");tq.textContent=tp||"— Mavzu hali kiritilmagan";if(!tp)tq.classList.add("e");
    const k=findBook(sub),bb=q(".bkb");
    if(k){const a=document.createElement("a");a.className="bkb";a.href=k.u;a.target="_blank";a.rel="noopener";a.textContent="Kitobi";bb.replaceWith(a)}else bb.onclick=()=>toast("Bu fan kitobi hali qoʻshilmagan");
    list.appendChild(c)});
  if(isT&&!ls.length)cmd(list,di)
}
$("pw").onclick=()=>{cur=addD(cur,-7);sched()};$("nw").onclick=()=>{cur=addD(cur,7);sched()};

/* ---- kitoblar ---- */
const nz=s=>s.toLowerCase().replace(/[^a-zа-я]/g,"");
function findBook(sub){const s=nz(sub);for(const c of [S.course,...Object.keys(BOOKS).filter(c=>c!==S.course)])for(const k of BOOKS[c]||[])if(k.k.some(x=>x[0]==="="?s===nz(x):s.includes(nz(x))))return k;return null}
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.x);toast.x=setTimeout(()=>e.classList.remove("on"),2200)}
function books(){
  view("bks");const L=BOOKS[S.course]||[],box=$("bl");box.innerHTML="";$("bkCap").textContent=S.course+"-kurs kitoblari";
  L.forEach(k=>{const a=document.createElement("a");a.className="bk2";a.href=k.u;a.target="_blank";a.rel="noopener";a.innerHTML="<span></span><i>›</i>";a.firstChild.textContent=k.t;box.appendChild(a)});
  if(!L.length)box.innerHTML='<div class="none">Bu kurs kitoblari tez orada qoʻshiladi</div>';
}

setInterval(()=>{if(!$("sch").classList.contains("hide"))sched()},60000);
if(S.name&&S.gender&&FACS.includes(S.fac)&&+S.course>=1&&+S.course<=4&&S.group)home();else{if(!S.name){S={};step=0}else step=!S.gender?1:!FACS.includes(S.fac)?2:3;wiz()}
</script>
</body>
</html>
